[package]
name = "dedup-service"
version = "0.1.0"
edition = "2021"
description = "Fuzzy record linkage for internship postings: groups rows that describe the same real-world job."
license = "MIT"

[lib]
name = "dedup"
path = "src/lib.rs"

[[bin]]
name = "dedup-service"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }

[profile.release]
lto = true
codegen-units = 1
